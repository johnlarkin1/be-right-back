# security-audit.yaml
# Dependency vulnerability scanning with cargo-audit
# Lightweight job — runs on ubuntu, separate from main CI to keep costs low
name: security-audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # Allow manual runs (e.g. after new advisory published)
  workflow_dispatch:
  # Run weekly even without code changes to catch newly published advisories
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # Warn-only for now — don't block PRs on pre-existing advisories
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit Binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.21

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
