<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; }
  .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .demo-col { display: flex; flex-direction: column; gap: 12px; }
  .demo-note { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const h = React.createElement, B = window.BeRightBack;
  const note = (t) => h("p", { className: "demo-note" }, t);
  const tools = [
    { toolName: "list_contacts", arguments: {}, status: "success", durationMs: 38, resultPreview: "Found 312 contacts" },
    { toolName: "search_messages", arguments: { query: "dinner plans" }, status: "running" },
    { toolName: "get_contact_stats", arguments: { contact: "Sam" }, status: "error", error: "Contact not found" }];
  const Demo = () => h("div", { className: "demo-col", style: { maxWidth: 520, gap: 8 } }, tools.map((t) => h(B.ToolCallCard, { key: t.toolName, tool: t })));
  ReactDOM.createRoot(document.getElementById("app")).render(h(Demo));
</script>
</body>
</html>
