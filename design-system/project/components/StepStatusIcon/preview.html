<!-- @dsCard group="Status" height=110 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; }
  .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .demo-col { display: flex; flex-direction: column; gap: 12px; }
  .demo-note { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const h = React.createElement, B = window.BeRightBack;
  const note = (t) => h("p", { className: "demo-note" }, t);
  function Demo() {
    const { isRetro } = B.useUIMode();
    return h("div", { className: "demo-row", style: { gap: 32 } }, ["completed", "active", "pending"].map((s) =>
      h("div", { key: s, className: "demo-row", style: { gap: 8 } },
        h(B.StepStatusIcon, { status: s, size: 20, color: "var(--color-accent)", isRetro }), note(s))));
  }
  ReactDOM.createRoot(document.getElementById("app")).render(h(Demo));
</script>
</body>
</html>
