<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; }

  html:not([data-theme="modern"]) .only-modern { display: none !important; }
  .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .demo-note { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="demo-row" style="align-items:stretch">
  <div class="card" style="padding:16px;flex:1;min-width:200px">
    <div class="font-display text-accent text-glow" style="font-size:18px;margin-bottom:4px">.card</div>
    <div class="text-secondary" style="font-size:12px">Your data never leaves your device</div>
  </div>
  <div class="card-elevated" style="padding:16px;flex:1;min-width:200px">
    <div class="font-display text-accent text-glow" style="font-size:18px;margin-bottom:4px">.card-elevated</div>
    <div class="text-secondary" style="font-size:12px">All processing happens locally on your Mac</div>
  </div>
