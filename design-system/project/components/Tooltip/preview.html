<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; }
  .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .demo-col { display: flex; flex-direction: column; gap: 12px; }
  .demo-note { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const h = React.createElement, B = window.BeRightBack;
  const note = (t) => h("p", { className: "demo-note" }, t);
  const term = (t) => h("span", { style: { color: "var(--color-accent)", fontSize: 12, borderBottom: "1px dashed var(--color-border-accent)" } }, t);
  const Demo = () => h("div", { className: "demo-col" }, note("Hover or focus a term."),
    h("div", { className: "demo-row", style: { gap: 48, paddingLeft: 80 } },
      h(B.Tooltip, { content: "Numbers that describe what a message means" }, term("Embeddings")),
      h(B.Tooltip, { content: "Home  \u23182", position: "right", delayMs: 0 }, term("Home"))));
  ReactDOM.createRoot(document.getElementById("app")).render(h(Demo));
</script>
</body>
</html>
