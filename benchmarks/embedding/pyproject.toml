[project]
name = "embedding-benchmark"
version = "0.1.0"
description = "Benchmark suite for testing embedding strategies"
requires-python = ">=3.11"
dependencies = [
    # MLX for embeddings - use mlx-embeddings for proper model loading
    "mlx>=0.24.0",
    "mlx-embeddings",
    "transformers>=4.40.0",
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",

    # Database
    "duckdb>=1.0.0",

    # Data handling
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",

    # System monitoring
    "psutil>=5.9.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utilities
    "rich>=13.0.0",
    "tabulate>=0.9.0",

    # macOS dependencies for attributedBody decoding
    "pyobjc-framework-Cocoa>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
