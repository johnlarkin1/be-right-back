[package]
name = "hdbscan-benchmark"
version = "0.1.0"
edition = "2021"
description = "Benchmark suite comparing HDBSCAN clustering implementations (Rust)"

# Exclude from parent workspace
[workspace]

[dependencies]
# Clustering
hdbscan = "0.10"

# Linear algebra for PCA
nalgebra = { version = "0.32", features = ["rand"] }

# Database
duckdb = { version = "1.0", features = ["bundled"] }

# Python interop (for UMAP - no good Rust impl)
pyo3 = { version = "0.21", features = ["auto-initialize"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# System info
sysinfo = "0.30"

[[bin]]
name = "hdbscan-benchmark"
path = "src/main.rs"
