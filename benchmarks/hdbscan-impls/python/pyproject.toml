[project]
name = "hdbscan-benchmark"
version = "0.1.0"
description = "Benchmark suite comparing HDBSCAN clustering implementations"
requires-python = ">=3.11"
dependencies = [
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
