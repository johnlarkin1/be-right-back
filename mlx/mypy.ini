[mypy]
files = src
show_error_codes = True
pretty = True
follow_imports_for_stubs = True

# mlx ships 1574 .pyi stubs but no PEP 561 `py.typed` marker, so mypy will not read them and
# reports import-not-found for every `import mlx.core`. `follow_imports = skip` alone does not
# suppress that -- it controls how far mypy follows a module it *has* found -- so these need
# ignore_missing_imports like every other untyped third-party package below.
[mypy-mlx]
follow_imports = skip
ignore_missing_imports = True

[mypy-mlx.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-mlx_embeddings.*]
ignore_missing_imports = True

[mypy-mlx_lm.*]
ignore_missing_imports = True

[mypy-igraph.*,leidenalg.*,pynndescent.*]
ignore_missing_imports = True

[mypy-umap]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-seaborn]
ignore_missing_imports = True

[mypy-pyarrow]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
